<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  {%- seo -%}
  {%- assign og = page.image | default: site.image -%}
  <meta property="og:image" content="{{ og | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="{{ page.image_alt | default: site.description | strip_newlines }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ og | absolute_url }}">
  {%- if page.layout == 'post' %}
  <meta property="og:type" content="article">
  <meta property="article:published_time" content="{{ page.date | date_to_xmlschema }}">
  {%- endif %}
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  {%- feed_meta -%}
</head>
<body>
  <header class="site-head">
    <div class="wrap">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/registry/' | relative_url }}">Forecast registry</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
      </nav>
    </div>
  </header>
  <main class="wrap">{{ content }}</main>
  <footer class="site-foot">
    <div class="wrap">
      Independent research on enterprise software economics. Built from public sources.
      &middot; <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
    </div>
  </footer>
</body>
</html>
