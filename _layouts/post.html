---
layout: default
---
<article>
  <h1>{{ page.title }}</h1>
  {%- if page.subtitle %}<p class="subtitle">{{ page.subtitle }}</p>{% endif -%}
  <p class="post-meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%-d %B %Y" }}</time></p>
  <div class="post-content">{{ content }}</div>
</article>
